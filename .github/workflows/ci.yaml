name: CI - Android

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + testes unitários + lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7


      - name: Instalar o JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar o Android SDK
        uses: android-actions/setup-android@v4

      - name: Configurar o Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Preparar o gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Compilar (debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Testes unitários
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint (só avisa por enquanto)
        run: ./gradlew lintDebug
        continue-on-error: true


      - name: Guardar relatórios de teste e lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-android
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14