name: Release - APK assinado

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versão que será publicada (ex.: v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  ci:
    name: CI (build + testes)
    uses: ./.github/workflows/ci.yaml

  release:
    name: Assinar o APK e publicar a Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
    env:

      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7


      - name: Conferir se os segredos de assinatura existem
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Segredo $name não configurado (Settings > Secrets and variables > Actions)."
              missing=1
            fi
          done
          exit "$missing"

      - name: Instalar o JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar o Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar as build-tools
        run: sdkmanager "build-tools;36.1.0"

      - name: Configurar o Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Preparar o gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Compilar o APK de release
        run: ./gradlew assembleRelease --stacktrace

      - name: Alinhar e assinar o APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"

          UNSIGNED=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$UNSIGNED" ]; then
            echo "::error::APK de release não encontrado em app/build/outputs/apk/release"
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner não encontrado nas build-tools"
            exit 1
          fi
          BUILD_TOOLS=$(dirname "$APKSIGNER")

          "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"

          OUT="AccuracyApp-${TAG}.apk"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$OUT" \
            "$RUNNER_TEMP/aligned.apk"

          # Confere a assinatura e mostra o certificado usado.
          "$APKSIGNER" verify --print-certs "$OUT"

          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Publicar a Release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Já existe uma Release com essa tag (re-execução): só troca o APK.
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            gh release create "$TAG" "$APK_PATH" \
              --title "AccuracyApp $TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi